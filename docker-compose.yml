services:
  orion:
    build:
      context: ../Orion
      dockerfile: Dockerfile
    image: orion-server:local
    ports:
      - "8080:8080"
    environment:
      ORION_STORAGE__URL: "sqlite:/app/data/orion.db"
      ORION_LOGGING__FORMAT: "pretty"
    volumes:
      - orion-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  ui:
    image: node:22-slim
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      ORION_URL: "http://orion:8080"
    volumes:
      - .:/app
      - ui-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      orion:
        condition: service_healthy
    profiles:
      - dev

  ui-prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: orion-ui:local
    ports:
      - "8081:8080"
    environment:
      ORION_URL: "http://orion:8080"
    depends_on:
      orion:
        condition: service_healthy
    profiles:
      - prod

volumes:
  orion-data:
  ui-node-modules:
