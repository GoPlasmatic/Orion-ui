name: CI

on:
  push:
    # `v2` carries the Orion 2.0 port until it merges to main.
    branches: [main, v2]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -b

  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Unit & Contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (incl. API ↔ OpenAPI contract)
        run: npm test

      - name: Contract drift check (generated types match vendored spec)
        run: npm run check:contract

  e2e:
    name: E2E Smoke
    runs-on: ubuntu-22.04
    env:
      # The Orion 2.0 commit this UI is built against. No 2.0 image is
      # published until Orion is tagged, so the job builds the server from
      # source at this commit; switch to `ghcr.io/goplasmatic/orion:2.0.0`
      # once the tag exists.
      ORION_REV: 9cfc5326a155b59b414bc12788bed4eef1f0a491
      # Throwaway keys for the server under test: the e2e suite exercises the
      # console's admin-key handling against a guarded server.
      ORION_ADMIN_KEY: ci-only-full-access-key-padded-past-32
      ORION_READ_ONLY_KEY: ci-only-read-only-key-padded-past-32
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Cold, this is the slow step (~30 min, as in Orion-ext's HA drill); the
      # GHA cache makes a rerun at the same commit a few minutes.
      - name: Build orion-server at the pinned commit
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: https://github.com/GoPlasmatic/Orion.git#${{ env.ORION_REV }}
          platforms: linux/amd64
          push: false
          load: true
          tags: orion-server:ci
          build-args: |
            GIT_HASH=${{ env.ORION_REV }}
            CARGO_PROFILE_DIST_CODEGEN_UNITS=16
            CARGO_PROFILE_DIST_LTO=false
          cache-from: type=gha,scope=orion-server-ci
          cache-to: type=gha,scope=orion-server-ci,mode=max

      - name: Start Orion server
        run: |
          docker run -d --name orion -p 8080:8080 \
            -e ORION_ADMIN_AUTH__ENABLED=true \
            -e ORION_ADMIN_AUTH__API_KEYS="$ORION_ADMIN_KEY" \
            -e ORION_ADMIN_AUTH__READ_ONLY_API_KEYS="$ORION_READ_ONLY_KEY" \
            orion-server:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz && exit 0
            sleep 1
          done
          echo "orion-server did not become healthy" >&2
          docker logs orion >&2
          exit 1

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:e2e
        env:
          ORION_URL: http://localhost:8080

      - name: Server logs on failure
        if: failure()
        run: docker logs orion

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
